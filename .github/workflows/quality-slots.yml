# System1 quality slots, native mode (system1-quality v1.3.0, base-ci v2026.17).
# L2 Runtime, L3 Integration, and L4 E2E are declared `na` and stay skipped.
name: Quality slots

on:
  workflow_call:

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: "26.12.1"
  NO_COLOR: "1"

jobs:
  s1-types:
    name: "S1: Types"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            src
            scripts
      - uses: nocoo/base-ci/.github/actions/setup-js@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
        with:
          package-manager: npm
          node-version: ${{ env.NODE_VERSION }}
          install-policy: blocked
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s2-lint:
    name: "S2: Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            .github
            docs
            scripts
            src
      - uses: nocoo/base-ci/.github/actions/setup-js@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
        with:
          package-manager: npm
          node-version: ${{ env.NODE_VERSION }}
          install-policy: blocked
      - name: Lint and format check
        run: npm run lint
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s3-workflow:
    name: "S3: Workflow"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            .github
      - uses: nocoo/base-ci/.github/actions/lint-workflows@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g1-secrets:
    name: "G1: Secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/design/art/
            !/design/audio/*.wav
            !/design/audio/**/*.wav
            !/public/art/
            !/public/audio/
            !/public/audio-edge/
            !/public/voice-preview/
            !/public/icons/
            !/public/assets/
      - uses: nocoo/base-ci/.github/actions/scan-secrets@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g2-dependencies:
    name: "G2: Dependencies"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            .github
      - uses: nocoo/base-ci/.github/actions/scan-dependencies@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
        with:
          lockfiles: "package-lock.json"
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  b1-build:
    name: "B1: Build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/design/art/
            !/design/audio/*.wav
            !/design/audio/**/*.wav
      - uses: nocoo/base-ci/.github/actions/setup-js@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
        with:
          package-manager: npm
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - name: Build production bundle and verify PWA
        run: |
          node scripts/build-media.mjs
          ./node_modules/.bin/vite build
          node scripts/build-live.mjs
          node scripts/build-pwa.mjs
          node scripts/check-pwa.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zoo-dist
          path: dist
          include-hidden-files: true
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l1-unit:
    name: "L1: Unit"
    needs:
      - b1-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/design/art/
      - uses: nocoo/base-ci/.github/actions/setup-js@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
        with:
          package-manager: npm
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zoo-dist
          path: dist
      - name: Content, player and schedule checks
        run: |
          npm run check
          node --experimental-strip-types scripts/check-audio-player.ts
          python3 scripts/check-audio-schedule.py
          npm run check:live
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l2-runtime:
    name: "L2: Runtime"
    if: ${{ vars.ENABLE_L2_RUNTIME == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "N/A — static assets Worker; no platform runtime suite"

  l3-integration:
    name: "L3: Integration"
    if: ${{ vars.ENABLE_L3_INTEGRATION == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "N/A — static site; no backend API boundary"

  l4-e2e:
    name: "L4: E2E"
    if: ${{ vars.ENABLE_L4_E2E == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "N/A — no automated Playwright E2E suite in CI"

  p1-package:
    name: "P1: Package"
    needs:
      - b1-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/design/art/
            !/design/audio/*.wav
            !/design/audio/**/*.wav
      - uses: nocoo/base-ci/.github/actions/setup-js@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
        with:
          package-manager: npm
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zoo-dist
          path: dist
      - name: Dry-run Wrangler deploy
        run: ./node_modules/.bin/wrangler deploy --dry-run
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  z1-gate:
    name: "Z1: Gate"
    if: always()
    needs:
      - s1-types
      - s2-lint
      - s3-workflow
      - g1-secrets
      - g2-dependencies
      - b1-build
      - l1-unit
      - l2-runtime
      - l3-integration
      - l4-e2e
      - p1-package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested-sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Validate all quality slots and tested SHAs
        id: gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module - <<'EOF'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const expectedSha = process.env.EXPECTED_SHA;
          const implSlots = ["s1-types", "s2-lint", "s3-workflow", "g1-secrets", "g2-dependencies", "b1-build", "l1-unit", "p1-package"];
          const naSlots = ["l2-runtime", "l3-integration", "l4-e2e"];
          const errors = [];

          for (const slot of implSlots) {
            const entry = needs[slot];
            if (!entry || entry.result !== "success") {
              errors.push(`impl slot ${slot} result is ${entry?.result ?? "missing"}`);
            } else if (entry.outputs?.["tested-sha"] !== expectedSha) {
              errors.push(`impl slot ${slot} tested-sha (${entry.outputs?.["tested-sha"]}) != ${expectedSha}`);
            }
          }

          for (const slot of naSlots) {
            const entry = needs[slot];
            if (!entry || entry.result !== "skipped") {
              errors.push(`na slot ${slot} expected skipped, got ${entry?.result ?? "missing"}`);
            }
          }

          if (errors.length > 0) {
            console.error("Z1 Gate failed:\n" + errors.map(e => "  - " + e).join("\n"));
            process.exit(1);
          }
          console.log(`Z1 Gate passed: ${implSlots.length} impl slots succeeded on ${expectedSha}, ${naSlots.length} na slots skipped.`);
          EOF
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
