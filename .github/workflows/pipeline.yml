name: Pipeline

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after quality gate passes
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  quality:
    uses: ./.github/workflows/quality-slots.yml

  deploy:
    name: Deploy Production
    needs: [quality]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true)
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@3703a073693d598159e87f77f99587e586c14cfe # v2026.24
    with:
      package-manager: npm
      node-version: "26.12.1"
      install-policy: blocked
      sparse-checkout: |
        /*
        !/design/
      artifact-name: zoo-dist-shell
      artifact-path: dist
      artifact-unpack-command: cp -a public/art public/audio public/audio-edge public/voice-preview dist/
      wrangler-version: lockfile
      environment: production
      concurrency-group: zoo-production
      timeout-minutes: 20
      verify-command: node scripts/verify-deployment.mjs https://zoo.hexly.ai "$SOURCE_SHA"
      verify-retries: 6
      verify-retry-seconds: 5
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
